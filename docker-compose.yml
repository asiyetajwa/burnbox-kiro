# Burn Box on one Ubuntu 24.04 VM. The live demo runs on a Google Cloud VM, deployed with deploy/setup-gcp.sh.
#
#   docker compose --profile images build   # builds the two box images (file box, link box)
#   docker compose up -d --build            # starts the app, the Docker proxy, the lab and the gate
#
# The inference key lives only in .env on this host. It is passed to the app and never to a box.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:8080"
      - "${MAIL_PUBLIC_PORT:-25}:2525"   # Forward It To Burn Box: inbound mail for check@MAIL_DOMAIN
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_PORT: 2525
      DOCKER_HOST: tcp://docker-proxy:2375
      VULTR_INFERENCE_API_KEY: ${VULTR_INFERENCE_API_KEY:-}
      VULTR_MODEL: ${VULTR_MODEL:-gemini-2.5-flash}
      VULTR_INFERENCE_BASE_URL: ${VULTR_INFERENCE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      STUB_LLM: ${STUB_LLM:-0}
      BOX_IMAGE: burnbox-box:latest
      BROWSER_IMAGE: burnbox-browser:latest
      LAB_NETWORK: burnbox-lab
      GATE_URL: ${GATE_URL:-http://gate.lab.test:3128}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      RUNS_PER_HOUR: ${RUNS_PER_HOUR:-30}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
    volumes:
      - burnbox-data:/app/data
    networks: [web, control]
    depends_on: [docker-proxy, lab, gate]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The app reaches Docker only through this proxy, which allows container and image calls and
  # nothing else (no exec, no volumes, no swarm, no system calls).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      POST: 1
      EXEC: 0
      VOLUMES: 0
      SYSTEM: 0
      DISABLE_IPV6: ${DISABLE_IPV6:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]

  # Demo phishing page and collector. Reachable only on the private lab network.
  lab:
    build: { context: sandbox/lab }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      lab:
        aliases: [invoices-portal.lab.test, collector.lab.test]

  # The only way out for a link box: HTTPS tunnels and plain GET to public addresses.
  gate:
    build: { context: sandbox/lab }
    entrypoint: ["python3", "-I", "/opt/burnbox/gate.py"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      lab:
        aliases: [gate.lab.test]
      egress: {}

  # Box images: built, never run as services. The app starts one container per run from them.
  box-image:
    profiles: [images]
    build: { context: sandbox/box }
    image: burnbox-box:latest
  browser-image:
    profiles: [images]
    build: { context: sandbox/browser }
    image: burnbox-browser:latest

networks:
  web: {}
  control:
    internal: true
  egress: {}
  lab:
    name: burnbox-lab
    internal: true

volumes:
  burnbox-data: {}
